<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDK Code Atlas</title><style>
:root{color-scheme:dark;font:14px/1.6 system-ui;background:#101822;color:#dce5ef}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;background:#182635;border-bottom:1px solid #31455a}h1{font-size:23px;margin:0;color:#74d9cc}small,.muted{color:#9bb0c5}main{display:grid;grid-template-columns:280px 1fr 380px;gap:16px;padding:18px}section,aside{min-width:0}input,select,button{font:inherit;background:#213448;color:inherit;border:1px solid #416079;border-radius:6px;padding:7px;margin:3px}button{cursor:pointer}button:hover{border-color:#74d9cc}.card,details{background:#182635;border:1px solid #31455a;border-radius:8px;padding:11px;margin:8px 0}summary{cursor:pointer;color:#9aeadf}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c141d;padding:12px;border-radius:6px;font:12px/1.5 monospace}ul{padding-left:20px}.badge{font-size:11px;background:#344354;border-radius:4px;padding:2px 5px;margin:4px}.warn{color:#f0c97c}.fn{display:block;text-align:left;width:98%;overflow-wrap:anywhere}#list{max-height:78vh;overflow:auto}.branches{border-left:2px solid #3e6f7e;margin-left:12px;padding-left:14px}h2{font-size:17px}a{color:#80e1d2}@media(max-width:1100px){main{grid-template-columns:230px 1fr}aside:last-child{grid-column:1/-1}}@media(max-width:650px){main{display:block}}
</style><header><h1>SDK Code Atlas <small>原型 · Clang 事实 / 可追溯证据</small></h1><div id="status"></div></header>
<main><aside><input id="search" placeholder="搜索函数 / ID" style="width:96%"><div id="list"></div></aside><section><div><select id="direction"><option value="down">向下：它调用谁</option><option value="up">向上：谁调用它</option></select><button id="trace">展开调用树</button><button id="paths">首次分歧 / 最上端</button><button id="request">导出补充分析请求</button></div><p class="muted">默认只看功能与输入输出；点击节点细节或展开一层。候选边不代表确定运行路径。</p><div id="path_choices"></div><div id="tree"></div></section><aside><h2>函数细节与数据流</h2><div id="detail">选择一个函数。</div><h2>静态 / 全局对象</h2><div id="objects"></div><h2>类型与布局</h2><div id="types"></div><h2>问题与分析边界</h2><div id="issues"></div></aside></main>
<script id="data" type="application/json">__ATLAS_DATA__</script><script>
'use strict';const B=JSON.parse(document.getElementById('data').textContent),F=new Map(B.nodes.map(x=>[x.id,x])),E=new Map(B.evidence.map(x=>[x.id,x]));let selected=B.nodes[0]?.id;
const StopLabels={implicit_special_member:'编译器默认生成的特殊成员函数：无源码实现可展开',linux:'Linux 函数：在此停止',glibc:'glibc 函数：在此停止',system_library:'系统库：在此停止',implementation_not_found:'实现未找到：在此停止',implementation_unavailable_with_parse_failures:'实现不可用：有相关解析失败',budget_pending:'分析预算已用尽，尚未查完',indirect_unresolved:'间接目标未确定：在此停止'};
const $=id=>document.getElementById(id);function el(t,text,cls){let e=document.createElement(t);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function json(x){return el('pre',JSON.stringify(x,null,2))}function button(t,fn){let b=el('button',t);b.onclick=fn;return b}
$('status').textContent=`快照 ${B.manifest.snapshot_id.slice(0,12)} · ${B.nodes.length} 个函数 · ${B.edges.length} 条目标关系 · ${B.issues.length} 个问题 · ${B.coverage.processed_units}/${B.coverage.total_available_units} TU。数据流：${B.dataflow_status?.mode==='clang_cfg'?'Clang CFG / '+B.dataflow_status.status:'基础表达式；未请求 CFG'}；别名分析未实现。`;
function evidence(ids,container){for(let id of ids||[]){let e=E.get(id);if(!e)continue;let d=el('details');d.append(el('summary',`${e.file}:${e.line||'?'} · ${e.hash.slice(0,10)}`),el('pre',e.text));container.append(d)}}
function show(id){selected=id;let f=F.get(id);if(!f)return;let box=$('detail');box.replaceChildren(el('h3',f.display_name),el('p',f.summary),json({id:f.id,signature:f.signature,parameters:f.parameters,return_type:f.return_type}));evidence(f.evidence_ids,box);let flows=B.flow_edges.filter(e=>e.owner===id);let d=el('details');d.append(el('summary',`基础表达式记录（不处理覆盖） (${flows.length})`));for(let x of flows){d.append(json(x));evidence(x.evidence_ids,d)}box.append(d);for(let p of f.parameters)box.append(button('追踪参数 '+p.name,()=>B.value_nodes?.length?showValueFlow(id,p.id,box):showFlow(p.id,box)));if(B.value_nodes?.length)box.append(button('返回值来源',()=>showValueFlow(id,null,box,true)));}
function showFlow(id,box){let seen=new Set([id]),q=[id],found=[],cap=500;while(q.length&&found.length<cap){let s=q.shift();for(let e of B.flow_edges.filter(e=>e.sources.includes(s))){found.push(e);if(!seen.has(e.target)){seen.add(e.target);q.push(e.target)}}}let d=el('details');d.open=true;d.append(el('summary','参数数据流 · may / 路径不敏感'),json({edges:found,truncated:q.length>0}));box.append(d)}

function showValueFlow(fid,symbol,box,backward=false){
 const values=new Map((B.value_nodes||[]).map(v=>[v.id,v]));
 let q=[...values.values()].filter(v=>v.owner===fid&&(backward?v.kind==='return':v.kind==='parameter'&&v.symbol===symbol)).map(v=>v.id),seen=new Set();
 const next=new Map();for(const v of values.values())for(const src of [...(v.sources||[]),...(v.control_sources||[])]){if(!next.has(src))next.set(src,[]);next.get(src).push(v.id)}
 while(q.length&&seen.size<2000){let id=q.shift();if(seen.has(id))continue;seen.add(id);let v=values.get(id);q.push(...(backward?[...(v?.sources||[]),...(v?.control_sources||[])]:next.get(id)||[]))}
 let d=el('details');d.open=true;d.append(el('summary',backward?'返回值来源 / 条件':'参数计算链 / 条件'));
 d.append(el('p','按 Clang CFG 求解；分支可行性、别名及运行时取值尚未证明。','muted'));
 const reached=[...seen].map(id=>values.get(id)).filter(Boolean);
 for(const v of reached){let row=el('details');row.append(el('summary',`${v.kind} · ${v.expression||v.name||v.reason||v.id}`),json(v));if(v.summary_function){let f=F.get(v.summary_function);row.append(button('查看被调函数计算链：'+(f?.display_name||v.summary_function),()=>{show(v.summary_function);showValueFlow(v.summary_function,null,$('detail'),true)}));row.append(json((B.return_summaries||[]).find(s=>s.function_id===v.summary_function)))}if(v.kind==='call_argument'){const call=[...values.values()].find(c=>c.kind==='call_result'&&c.callsite===v.callsite&&c.summary_function);if(call){const f=F.get(call.summary_function),p=f?.parameters[v.index];if(p)row.append(button('继续追踪实参 → '+f.display_name+' / '+p.name,()=>{show(f.id);showValueFlow(f.id,p.id,$('detail'))}))}}d.append(row)}
 d.append(json({truncated:q.length>0,summary:(B.return_summaries||[]).find(s=>s.function_id===fid),cfg:(B.cfgs||[]).find(c=>c.function_id===fid)}));box.append(d);
}

function node(id,path){let f=F.get(id);let card=el('div',undefined,'card');if(!f){card.textContent=id;return card}card.append(button(f.display_name,()=>show(id)),el('p',f.summary),el('small',`${f.parameters.map(p=>p.name+': '+p.type).join(', ')} → ${f.return_type}`));if(path.includes(id)){card.append(el('div','递归：在此折叠','warn'));return card}let up=$('direction').value==='up',edges=B.edges.filter(e=>(up?e.target:e.source)===id),d=el('details');d.append(el('summary',`${up?'调用者':'被调用者'} ${edges.length} · 点击展开一层`));let built=false;d.addEventListener('toggle',()=>{if(!d.open||built)return;built=true;let inner=el('div',undefined,'branches');for(let e of edges){inner.append(el('span',e.certainty+' · '+e.origin,'badge'),node(up?e.source:e.target,[...path,id]));}for(let c of B.callsites.filter(c=>!up&&c.owner===id&&!B.edges.some(e=>e.callsite===c.id))){inner.append(el('p',c.callee+'：'+(StopLabels[c.stop_reason]||'实现未找到 / 未解析'),'warn'))}d.append(inner)});if(up&&!edges.length)card.append(el('p','本条调用链最上端：没有已知调用者','badge'));card.append(d);return card}
function renderTree(){$('path_choices').replaceChildren();if(selected)$('tree').replaceChildren(node(selected,[]))}$('trace').onclick=renderTree;$('direction').onchange=renderTree;
function list(){let q=$('search').value.toLowerCase();$('list').replaceChildren();for(let f of B.nodes.filter(f=>(f.name+f.id).toLowerCase().includes(q)).slice(0,500)){$('list').append(button(f.display_name,()=>{show(f.id);renderTree()}));$('list').lastChild.className='fn'}}$('search').oninput=list;
for(let o of B.objects.filter(o=>o.lifetime==='static')){let d=el('details');d.append(el('summary',o.name+' : '+o.type),json(o),json(B.state_events.filter(e=>e.object_id===o.id)));evidence(o.evidence_ids,d);$('objects').append(d)}
for(let t of B.types){let d=el('details');d.append(el('summary',t.name),json(t));$('types').append(d)}
for(let i of B.issues){let d=el('details');d.append(el('summary',i.kind+' · '+i.status),json(i));evidence(i.evidence_ids,d);$('issues').append(d)}

function pathChoices(){
 const up=$('direction').value==='up',out=$('path_choices');out.replaceChildren();
 let queue=[[selected]],paths=[],truncated=false;
 while(queue.length&&paths.length<1000){let p=queue.shift(),id=p[p.length-1],next=[...new Set(B.edges.filter(e=>(up?e.target:e.source)===id).map(e=>up?e.source:e.target))].sort();
  if(!next.length||p.length>=30){paths.push(p);truncated ||= next.length>0;continue}
  for(let n of next){if(p.includes(n))paths.push([...p,n]);else if(queue.length+paths.length<1000)queue.push([...p,n]);else truncated=true}
 }
 truncated ||= queue.length>0;
 let common=0;if(paths.length)while(paths.every(p=>p.length>common&&p[common]===paths[0][common]))common++;
 const choices=[...new Set(paths.filter(p=>p.length>common).map(p=>p[common]))];
 out.append(el('p',`已知图内 ${paths.length} 条函数路径${truncated?'（预算截断）':''}；点击首个不同函数继续查看。`));
 for(let id of choices)out.append(button('首次分歧：'+(F.get(id)?.display_name||id),()=>{show(id);renderTree()}));
 if(up){const tops=[...new Set(paths.map(p=>p[p.length-1]).filter(id=>!B.edges.some(e=>e.target===id)))];for(let id of tops)out.append(button('最上端：'+(F.get(id)?.display_name||id),()=>{show(id);renderTree()}));}
 if(!choices.length)out.append(el('p','当前结果没有多个不同函数分支；终点原因见调用树。'));
}
$('paths').onclick=pathChoices;
if(B.manifest.assumptions?.length){$('status').append(el('p','当前结果包含用户接受的替代配置；详情见下方。','warn'));$('issues').append(json(B.manifest.assumptions));}

$('request').onclick=()=>{let b=new Blob([JSON.stringify({snapshot_id:B.manifest.snapshot_id,interface:selected,request:'expand_analysis'},null,2)],{type:'application/json'});let a=el('a');a.href=URL.createObjectURL(b);a.download='analysis_request.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};list();if(selected){show(selected);renderTree()}
</script></html>
