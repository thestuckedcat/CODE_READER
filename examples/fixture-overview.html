function show(id){selected=id;let f=F.get(id);if(!f)return;let box=$('detail');box.replaceChildren(el('h3',f.display_name),el('p',f.summary),json({id:f.id,signature:f.signature,parameters:f.parameters,return_type:f.return_type}));evidence(f.evidence_ids,box);let flows=B.flow_edges.filter(e=>e.owner===id);let d=el('details');d.append(el('summary',`赋值 / 传参 / 返回关系 (${flows.length})`));for(let x of flows){d.append(json(x));evidence(x.evidence_ids,d)}box.append(d);for(let p of f.parameters)box.append(button('追踪参数 '+p.name,()=>showFlow(p.id,box)));}
function showFlow(id,box){let seen=new Set([id]),q=[id],found=[],cap=500;while(q.length&&found.length<cap){let s=q.shift();for(let e of B.flow_edges.filter(e=>e.sources.includes(s))){found.push(e);if(!seen.has(e.target)){seen.add(e.target);q.push(e.target)}}}let d=el('details');d.open=true;d.append(el('summary','参数数据流 · may / 路径不敏感'),json({edges:found,truncated:q.length>0}));box.append(d)}
function node(id,path){let f=F.get(id);let card=el('div',undefined,'card');if(!f){card.textContent=id;return card}card.append(button(f.display_name,()=>show(id)),el('p',f.summary),el('small',`${f.parameters.map(p=>p.name+': '+p.type).join(', ')} → ${f.return_type}`));if(path.includes(id)){card.append(el('div','递归：在此折叠','warn'));return card}let up=$('direction').value==='up',edges=B.edges.filter(e=>(up?e.target:e.source)===id),d=el('details');d.append(el('summary',`${up?'调用者':'被调用者'} ${edges.length} · 点击展开一层`));let built=false;d.addEventListener('toggle',()=>{if(!d.open||built)return;built=true;let inner=el('div',undefined,'branches');for(let e of edges){inner.append(el('span',e.certainty+' · '+e.origin,'badge'),node(up?e.source:e.target,[...path,id]));}for(let c of B.callsites.filter(c=>!up&&c.owner===id&&!B.edges.some(e=>e.callsite===c.id))){inner.append(el('p',c.callee+'：外部 / 未解析','warn'))}d.append(inner)});card.append(d);return card}
function renderTree(){if(selected)$('tree').replaceChildren(node(selected,[]))}$('trace').onclick=renderTree;$('direction').onchange=renderTree;
function list(){let q=$('search').value.toLowerCase();$('list').replaceChildren();for(let f of B.nodes.filter(f=>(f.name+f.id).toLowerCase().includes(q)).slice(0,500)){$('list').append(button(f.display_name,()=>{show(f.id);renderTree()}));$('list').lastChild.className='fn'}}$('search').oninput=list;
for(let o of B.objects.filter(o=>o.lifetime==='static')){let d=el('details');d.append(el('summary',o.name+' : '+o.type),json(o),json(B.state_events.filter(e=>e.object_id===o.id)));evidence(o.evidence_ids,d);$('objects').append(d)}
for(let t of B.types){let d=el('details');d.append(el('summary',t.name),json(t));$('types').append(d)}
for(let i of B.issues){let d=el('details');d.append(el('summary',i.kind+' · '+i.status),json(i));evidence(i.evidence_ids,d);$('issues').append(d)}
$('request').onclick=()=>{let b=new Blob([JSON.stringify({snapshot_id:B.manifest.snapshot_id,interface:selected,request:'expand_analysis'},null,2)],{type:'application/json'});let a=el('a');a.href=URL.createObjectURL(b);a.download='analysis_request.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};list();if(selected){show(selected);renderTree()}
</script></html>
